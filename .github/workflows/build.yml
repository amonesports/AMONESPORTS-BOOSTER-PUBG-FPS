name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Seteaza JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Da permisiuni la gradlew
        run: chmod +x gradlew

      - name: Compileaza APK Debug
        run: ./gradlew assembleDebug

      - name: Salveaza APK-ul ca artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmonKode-APK
          path: app/build/outputs/apk/debug/app-debug.apk
